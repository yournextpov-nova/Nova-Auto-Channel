# ============================================================
# EDIT THIS FILE to control your channel. Nothing else needs
# to change for day-to-day operation.
# ============================================================

channel:
  name: "Next POV"
  language: "English"

# The "character bible" is injected into EVERY script prompt and
# EVERY image prompt, so Nova / the cat / the panda stay
# recognizable across videos even though the images are freshly
# generated each time.
characters:
  nova: >
    A young slightly teenager

Slightly messy, short hair in a natural brown color.

A single small yellow star-shaped hair clip on her right side.

Bright, round eyes with a warm color (Hazel). Add sparkle dots in the pupils to subtly mirror stars.

A natural, warm skin tone with faint freckles.

A kid-friendly, slightly chibi-proportioned body (round cheeks, small hands/feet).

A simple white graphic tee with a small star on chest.

Layered with a denim jacket (rolled-up sleeves) in a soft navy color.

Comfortable jeans color shorts (slightly rolled at the ankles).

Classic white color-block sneakers.

A tiny jeans backpack with 2 zips only (one large pocket zip and one small pocket zip, with a yellow Star patch).
  cat: >
    *"A Fat Cute chubby orange tabby cat with fluffy fur and deep blue eyes . 
    Ultra-realistic 8K, cinematic lighting, hyper-detailed fur textures, 
    mischievous expression, depth of field. Style: Pixar meets realism."*
  panda: >
    a gentle giant panda named Momo, big and round, calm and wise,
    black and white fur, small round glasses (signature item),
    speaks slowly and gives thoughtful advice.

art_style: >
  Pixar-style 3D animated cartoon render, soft global illumination,
  warm cheerful color palette, smooth rounded shapes, family-friendly,
  cinematic children's animated movie still, highly detailed, 3D render

video:
  target_length_minutes: 6
  audience: "kids, family-friendly, no violence, no scary content"
  # Leave blank to let the AI invent a new story each day using the
  # characters above. Or add fixed ideas here and it will use them
  # in order before falling back to inventing new ones.
  topic_ideas: []

upload:
  privacy_status: "public"   # public | unlisted | private
  category_id: "1"            # 1 = Film & Animation
  default_tags:
    - "Nova"
    - "kids story"
    - "animated story"
    - "pixar style"
    - "bedtime story"
